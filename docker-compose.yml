version: "3.9"

# =============================================
# Docker Compose LOCAL DEVELOPMENT
# Chạy: docker compose up -d
# =============================================

services:

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: datn_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myphone
      MYSQL_USER: datn_user
      MYSQL_PASSWORD: datn_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DatabaseDATN.sql:/docker-entrypoint-initdb.d/init.sql  # Auto import DB
    networks:
      - datn_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    container_name: datn_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - datn_network

  # MinIO (File Storage thay thế)
  minio:
    image: minio/minio:latest
    container_name: datn_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: "12345678"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - datn_network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datn_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/myphone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&nullCatalogMeansCurrent=true
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: root
      MINIO_SECRET_KEY: "12345678"
      MINIO_BUCKET_NAME: myphone
      MINIO_URL_PREFIX: http://localhost:8080/api/files
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      JWT_SECRET: bXlwaG9uZS1kZXYtc2VjcmV0LWtleS0zMi1ieXRlLWF0LWxlYXN0ISE=
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    ports:
      - "8080:8080"
    networks:
      - datn_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URL: http://localhost:8080
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "1091375226649-tipibo3vdvk3n2hb0ptepksv0tcmqecs.apps.googleusercontent.com"
    container_name: datn_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_URL: http://localhost:8080
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "3000:3000"
    networks:
      - datn_network

volumes:
  mysql_data:
  minio_data:

networks:
  datn_network:
    driver: bridge
