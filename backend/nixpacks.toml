# Nixpacks config for Railway
[phases.setup]
nixPkgs = ["maven", "jdk17"]

[phases.build]
cmds = ["mvn clean package -DskipTests"]

[start]
# Disable Railway's automatic JAVA_TOOL_OPTIONS to avoid warnings
# Explicitly set JVM options for Railway's 512MB RAM limit
cmd = "java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -XX:+UseSerialGC -Xss512k -jar target/*.jar"
