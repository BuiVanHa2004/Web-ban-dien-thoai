# Gmail OAuth2 API (thay thế SMTP - hoạt động trên Render.com)
gmail.client-id=${GMAIL_CLIENT_ID:dummy}
gmail.client-secret=${GMAIL_CLIENT_SECRET:dummy}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN:dummy}
gmail.from=${GMAIL_FROM:buivanha22032004@gmail.com}

# Giữ lại spring.mail để dùng jakarta.mail cho việc build MIME message (không kết nối SMTP thực)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Tắt mail health check (để tránh timeout 30s do Render block SMTP)
management.health.mail.enabled=false

# Actuator - expose health với chi tiết để debug
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Giảm RAM usage cho Render free tier 512MB
spring.jpa.open-in-view=true
server.tomcat.max-threads=20
server.tomcat.min-spare-threads=5
spring.datasource.hikari.maximum-pool-size=3
