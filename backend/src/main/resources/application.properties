spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
# Upstash Redis yêu cầu SSL - chỉ set khi có REDIS_URL
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:root}
minio.secret-key=${MINIO_SECRET_KEY:12345678}
minio.bucket-name=${MINIO_BUCKET_NAME:myphone}
minio.region=${MINIO_REGION:}
# Auto-detect URL prefix from server or use env variable
minio.url-prefix=${MINIO_URL_PREFIX:${SERVER_URL:http://localhost:8080}/api/files}

